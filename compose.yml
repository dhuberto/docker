# =============================================================================
# compose.yml — Orquestração (go-app + PostgreSQL)
# =============================================================================
name: go-app

services:
  # ---------------------------------------------------------------------------
  # Banco de dados — Postgres Alpine
  # ---------------------------------------------------------------------------
  # Usa a tag `alpine` (sempre a versão estável mais recente do Postgres).
  # ---------------------------------------------------------------------------
  postgres-go:
    image: postgres:alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ espera o mount em /var/lib/postgresql (não em /data).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # $$ escapa a substituição do Compose: o sh do container expande
      # $POSTGRES_USER e $POSTGRES_DB.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Aplicação — Go + Alpine (imagem final ~20 MB)
  # ---------------------------------------------------------------------------
  # As envs DB_* são as mesmas lidas pelo `src/main.go`. A porta 3000 é o
  # default do `PORT` na aplicação.
  #
  # DB_HOST=postgres-go → precisa bater com o nome do serviço do banco.
  #
  # image: go-app:latest → nome explícito da imagem (evita "go-app-go-app").
  # ---------------------------------------------------------------------------
  go-app:
    image: go-app:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres-go:
        condition: service_healthy
    environment:
      - DB_HOST=postgres-go
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=3000
    ports:
      - "3000:3000"

# -----------------------------------------------------------------------------
# Volume nomeado — persistência do Postgres
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
