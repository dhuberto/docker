# =============================================================================
# compose.yml — Orquestração (go-app + PostgreSQL)
# =============================================================================
# Sobe a aplicação go-app + um Postgres.
# =============================================================================
name: go-app

services:
  # ---------------------------------------------------------------------------
  # Banco de dados — Postgres Alpine
  # ---------------------------------------------------------------------------
  # Usa a tag `alpine` (sempre a versão estável mais recente do Postgres).
  # ---------------------------------------------------------------------------
  postgres-go:
    image: postgres:alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Aplicação — Go + Alpine (imagem final ~20 MB)
  # ---------------------------------------------------------------------------
  # As envs DB_* são as mesmas lidas pelo `src/main.go`. A porta 3000 é o
  # default do `PORT` na aplicação.
  #
  # DB_HOST=postgres-go → precisa bater com o nome do serviço do banco.
  # ---------------------------------------------------------------------------
  go-app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres-go:
        condition: service_healthy
    environment:
      - DB_HOST=postgres-go
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - PORT=3000
    ports:
      - "3000:3000"

# -----------------------------------------------------------------------------
# Volume nomeado — persistência do Postgres
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
